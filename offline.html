<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are offline — Krishna Tools</title><meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;background:#FFFBEB;color:#1f2937;margin:0;padding:24px;text-align:center}
.c{max-width:480px;margin:40px auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
a{display:block;padding:10px;margin:6px 0;border:1px solid #e5e7eb;border-radius:10px;color:#1E3A8A;text-decoration:none}
button{margin-top:12px;padding:10px 18px;border:0;border-radius:10px;background:#1E3A8A;color:#fff;font-size:15px}</style></head>
<body><div class="c"><div style="font-size:48px">🦚</div><h1 style="font-size:22px">You are offline</h1>
<p>Check your internet connection and try again. Pages you opened recently:</p><div id="r"></div>
<button onclick="location.reload()">Try again</button></div>
<script>try{var r=JSON.parse(localStorage.getItem('kt-recent')||'[]');document.getElementById('r').innerHTML=r.slice(0,6).map(function(x){return '<a href="'+x.u+'">'+String(x.n).replace(/</g,'&lt;')+'</a>'}).join('')||'<p style="opacity:.6">None yet.</p>'}catch(e){}</script>
</body></html>
